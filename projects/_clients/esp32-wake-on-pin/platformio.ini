[env:esp32]
platform = espressif32
; board = esp32dev
; board = esp32-c3-devkitm-1
board = seeed_xiao_esp32c3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1